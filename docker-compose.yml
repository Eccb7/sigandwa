version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sigandwa_postgres
    network_mode: "host"
    environment:
      POSTGRES_USER: sigandwa
      POSTGRES_PASSWORD: sigandwa_dev
      POSTGRES_DB: sigandwa
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigandwa -p 5434"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: -p 5434

  neo4j:
    image: neo4j:5.15-community
    container_name: sigandwa_neo4j
    network_mode: "host"
    environment:
      NEO4J_AUTH: neo4j/sigandwa_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sigandwa_dev 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
